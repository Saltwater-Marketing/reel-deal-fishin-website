# Netlify settings for reeldealfishin.com
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Serve the reports index at /fishing-reports (no trailing slash)
[[redirects]]
  from = "/fishing-reports"
  to = "/fishing-reports.html"
  status = 200

